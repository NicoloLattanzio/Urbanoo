<!DOCTYPE html>
<html lang="it">
<head>
    <title>Urbanoo - Agenzia Immobiliare</title>
    
    <meta charset="utf-8">
    <meta name="description" content="Aggiungi qui le proprietà dell'Agenzia Immobiliare Urbanoo per condividerle con potenziali acquirenti e affittuari.">
    <meta name="keywords" content="agenzia immobiliare, proprietà, vendita case, aggiungi, condividere">
    <link rel="stylesheet" href="./styles/style.css" media="screen">
    <link rel="stylesheet" href="./styles/mini.css" media="screen and (max-width:768px)">
    <link rel="stylesheet" href="./styles/print.css" media="print">

</head>
<body>
    <header>
        <h1><span lang="en">URBANOO</span> Agenzia Immobiliare</h1>
        <h2>Trova la casa dei tuoi sogni</h2>
        <nav title="Barra di navigazione principale">
            <ul>
                <li lang="en"><a href="./index.html">Home</a></li>
                <li><a href="./aboutus.html">Chi Siamo</a></li>
                <li><a href="./proprietà.html">Proprietà</a></li>
                <li><a href="./contatti.html">Contatti</a></li>
                <li><a href="./areariservata.html"><img src="" alt="profilo utente"></a></li>
            </ul>
        </nav>
    </header>
    <div class="form-container">
        <h1>Aggiungi una nuova proprietà</h1>
        <form action="../php/aggiungi_proprieta.php" method="post">
            <label for="scelta">Tipologia Proprieta:</label>
            <select id="scelta" name="scelta">
                <option value="Villa">Villa</option>
                <option value="Appartamento">Appartamento</option>
                <option value="Bifamiliare">Bifamiliare</option>
            </select><br><br>

            <label for="luogo">Luogo:</label>
            <input type="text" id="luogo" name="luogo" required placeholder="Es. Padova"  data-msg-required="Per favore, inserisci il luogo" 
            data-msg-invalid="Formato non corretto">
            <br><br>

            <label for="prezzo">Prezzo:</label>
            <input type="number" id="prezzo" name="prezzo" required placeholder="Es. 150000" data-msg-required="Per favore, inserisci il prezzo" 
            data-msg-invalid="Formato non corretto">

            <label for="immagine">Immagine:</label>
            <input type="file" id="immagine" name="immagine" required>

            <input type="submit" value="Aggiungi Proprieta" title="Clicca qui per confermare l'aggiunta della proprieta">
        </form>
    </div>
    
    <footer>
        <p>&copy; 2025 Urbanoo: Agenzia Immobiliare. P.IVA 1234567890. Tutti i diritti sono riservati</p>
    </footer>
</body>
</html>
