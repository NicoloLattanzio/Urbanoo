    <div class="form-container">
        <h1>Form di modifica della proprietà:</h1>

        [messaggio]

        <form action="../php/modifica_proprieta.php" method="post">
            <input type="hidden" name="id" value="[id]">

            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" value="[nome]" required>
            </div>

            <div>
                <label for="descrizione">Descrizione:</label>
                <textarea id="descrizione" name="descrizione" required>[descrizione]</textarea>
            </div>

            <div>
                <label for="prezzo">Prezzo (&euro;):</label>
                <input type="number" id="prezzo" name="prezzo" value="[prezzo]" required>
            </div>

            <div>
                <label for="disponibilita">Stato Disponibilità:</label>
                <select id="disponibilita" name="disponibilita">
                    <option value="1" [select_si]>Disponibile</option>
                    <option value="0" [select_no]>Venduto / Non disponibile</option>
                </select>
            </div>
            <input type="submit" name="submit" value="Salva Modifiche">
        </form>
    </div>
